version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://user:password@db:5432/wordai
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      - db
      - redis
      - qdrant
    networks:
      - word-ai-network

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - word-ai-network

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=wordai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - word-ai-network

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - word-ai-network

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - word-ai-network

networks:
  word-ai-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
